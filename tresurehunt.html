function showToast(text) {
  const el = document.createElement("div");
  el.className = "toast bg-white border border-gray-200 shadow-lg rounded-xl px-4 py-3 max-w-xs text-sm flex items-start gap-2";
  el.innerHTML = `<span class="text-lg">💬</span><span class="text-gray-700">${escapeHtml(text)}</span>`;
  toastRoot.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity 0.4s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 400); }, 4000);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

      </button>
    </div>`;

  document.getElementById("chatBubbleBtn").onclick = toggleChatPanel;
  document.getElementById("chatCloseBtn").onclick = () => { chatOpen = false; syncChatPanelVisibility(); };
  document.getElementById("chatSend").onclick = sendChatMessage;
  document.getElementById("chatInput").onkeydown = (e) => { if (e.key === "Enter") sendChatMessage(); };

  drawChatMessages();
}

function syncChatPanelVisibility() {
  const panel = document.getElementById("chatPanel");
  if (!panel) return;
  panel.classList.toggle("hidden", !chatOpen);
  if (chatOpen) {
    unreadCount = 0;
    const badge = document.getElementById("chatBadge");
    if (badge) badge.classList.add("hidden");
    const box = document.getElementById("chatMessages");
    if (box) box.scrollTop = box.scrollHeight;
  }
}

function toggleChatPanel() {
  chatOpen = !chatOpen;
  syncChatPanelVisibility();
}

function drawChatMessages() {
  const box = document.getElementById("chatMessages");
  if (!box || !chatCtx) return;
  if (chatMessages.length === 0) {
    box.innerHTML = `<div class="text-xs text-gray-400 text-center mt-6">Niciun mesaj încă. Scrie primul!</div>`;
    return;
  }
  box.innerHTML = chatMessages.map(m => {
    const mine = m.sender === chatCtx.viewerRole;
    const label = m.sender === "referee" ? "Arbitru" : "Echipă";
    return `
      <div class="flex ${mine ? "justify-end" : "justify-start"}">
        <div class="max-w-[80%] rounded-xl px-3 py-2 text-sm ${mine ? "bg-[#009639] text-white" : "bg-gray-100 text-gray-700"}">
          <div class="text-[10px] uppercase tracking-wide font-bold opacity-70 mb-0.5">${label}</div>
          ${escapeHtml(m.content)}
        </div>
      </div>`;
  }).join("");
  if (chatOpen) box.scrollTop = box.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !chatCtx) return;
  input.value = "";
  try {
    await supabase.from("messages").insert({ team_id: chatCtx.teamId, sender: chatCtx.viewerRole, content: text });
  } catch (e) { console.error(e); }
}

async function loadChatHistory(teamId) {
  const { data, error } = await supabase.from("messages").select("*").eq("team_id", teamId).order("created_at", { ascending: true });
  if (error) { console.error(e); return []; }
  return data;
}

function teardownChat() {
  if (chatRealtimeChannel) { supabase.removeChannel(chatRealtimeChannel); chatRealtimeChannel = null; }
  if (chatPollId) { clearInterval(chatPollId); chatPollId = null; }
  chatCtx = null;
  chatMessages = [];
  chatOpen = false;
  unreadCount = 0;
  chatRoot.innerHTML = "";
}

async function setupChat(teamId, viewerRole, counterpartLabel, counterpartEmoji) {
  teardownChat();
  chatCtx = { teamId, viewerRole, counterpartLabel, counterpartEmoji };
  chatMessages = await loadChatHistory(teamId);
  renderChatWidget();

  chatRealtimeChannel = supabase
    .channel(`chat-${teamId}-${viewerRole}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `team_id=eq.${teamId}` }, (payload) => {
      chatMessages.push(payload.new);
      drawChatMessages();
      if (payload.new.sender !== viewerRole) {
        if (!chatOpen) {
          unreadCount += 1;
          const badge = document.getElementById("chatBadge");
          if (badge) { badge.textContent = unreadCount; badge.classList.remove("hidden"); }
        }
        const fromLabel = payload.new.sender === "referee" ? "Arbitru" : counterpartLabel;
        showToast(`Mesaj nou de la ${fromLabel}: "${payload.new.content.slice(0, 60)}"`);
      }
    })
    .subscribe();

  chatPollId = setInterval(async () => {
    const fresh = await loadChatHistory(teamId);
    if (fresh.length !== chatMessages.length) {
      chatMessages = fresh;
      drawChatMessages();
    }
  }, 8000);
}

// ---------- DATA HELPERS ----------
async function fetchSubmissions(teamId) {
  const { data, error } = await supabase.from("submissions").select("*").eq("team_id", teamId);
  if (error) { console.error(error); return {}; }
  const map = {};
  for (const row of data) map[row.task_id] = row;
  return map;
}

async function compressImage(file, maxWidth = 900, quality = 0.65) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(teamId, taskId, file) {
  const blob = await compressImage(file);
  const path = `${teamId}/${taskId}-${Date.now()}.jpg`;
  const { error: upErr } = await supabase.storage.from("submissions").upload(path, blob, { contentType: "image/jpeg" });
  if (upErr) throw upErr;
  const { data: pub } = supabase.storage.from("submissions").getPublicUrl(path);
  return pub.publicUrl;
}

// ---------- LEADERBOARD ----------
async function computeLeaderboard() {
  const { data, error } = await supabase.from("submissions").select("team_id, score");
  if (error) { console.error(error); return []; }
  const totals = {};
  for (const t of TEAMS) totals[t.id] = 0;
  for (const row of data) {
    if (row.score) totals[row.team_id] = (totals[row.team_id] || 0) + row.score;
  }
  return TEAMS.map(t => ({ ...t, score: totals[t.id] || 0 })).sort((a, b) => b.score - a.score);
}

async function renderLeaderboard() {
  cleanupRealtime();
  teardownChat();
  app.innerHTML = headerHtml("🏆 Clasament live", "Se actualizează automat", true) +
    `<div class="flex justify-center py-12 text-gray-400">Se încarcă...</div>`;
  document.getElementById("backBtn").onclick = () => { renderRoleSelect(); };

  const draw = async () => {
    const ranking = await computeLeaderboard();
    const rows = ranking.map((t, i) => {
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i + 1}.`;
      return `
        <div class="flex items-center gap-4 bg-white rounded-xl border border-gray-100 shadow-sm p-4 mb-2">
          <div class="w-8 text-center font-bold text-gray-500">${medal}</div>
          <div class="text-2xl">${t.emoji}</div>
          <div class="flex-1 font-semibold text-gray-800">${t.name}</div>
          <div class="font-bold text-[#009639] text-lg">${t.score} pct</div>
        </div>`;
    }).join("");
    app.innerHTML = headerHtml("🏆 Clasament live", "Se actualizează automat", true) + `<div>${rows}</div>`;
    document.getElementById("backBtn").onclick = () => { renderRoleSelect(); };
  };

  await draw();

  realtimeChannel = supabase
    .channel("leaderboard-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "submissions" }, draw)
    .subscribe();

  const pollId = setInterval(draw, 6000);
  const origCleanup = cleanupRealtime;
  cleanupRealtime = () => { clearInterval(pollId); origCleanup(); cleanupRealtime = origCleanup; };
}

}

function drawPlayerTasks(team, submissions) {
  const totalScore = Object.values(submissions).reduce((s, sub) => s + (sub.score || 0), 0);

  const summary = `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-wide text-gray-400 font-bold">Scor curent</div>
        <div class="text-2xl font-bold text-[#009639]">${totalScore} pct</div>
      </div>
      <button id="viewBoardBtn" class="text-sm font-semibold text-[#7a8c00] hover:underline">🏆 Vezi clasamentul</button>
    </div>`;

  const taskCards = TASKS.map(task => {
    const sub = submissions[task.id];
    let photoUrl = null, textAnswer = "";
    if (sub) {
      if (task.needsText) {
        try { const parsed = JSON.parse(sub.content); photoUrl = parsed.url; textAnswer = parsed.answer || ""; }
        catch (e) { photoUrl = sub.content; }
      } else {
        photoUrl = sub.content;
      }
    }
    return `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4" data-task="${task.id}">
        <div class="flex items-start justify-between gap-3 mb-2">
          <div>
            <div class="font-bold text-gray-800">${task.title}</div>
            <div class="text-sm text-gray-500 mt-1">${task.prompt}</div>
          </div>
          ${statusPillHtml(sub?.score, task.points, !!sub)}
        </div>
        <div class="mt-3">
          ${photoUrl ? `<img src="${photoUrl}" class="w-full max-h-56 object-cover rounded-xl mb-3 border border-gray-100">` : ""}
          ${task.needsText ? `
            <label class="block text-xs font-semibold text-gray-500 mb-1">${task.textLabel}</label>
            <input type="text" class="textInput w-full text-sm border-2 border-gray-200 rounded-lg px-3 py-2 mb-3 focus:border-[#009639] focus:outline-none" value="${textAnswer ? textAnswer.replace(/"/g, "&quot;") : ""}" placeholder="Răspunsul vostru...">
          ` : ""}
          <label class="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg border-2 border-[#009639] text-[#009639] hover:bg-[#e8f5ed] cursor-pointer transition-colors">
            📷 ${sub ? "Înlocuiește poza" : "Încarcă poza"}
            <input type="file" accept="image/*" capture="environment" class="hidden photoInput">
          </label>
          <span class="statusMsg text-xs text-gray-400 ml-2"></span>
        </div>
      </div>`;
  }).join("");

  const huntCard = `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <div class="font-bold text-gray-800">Obiectiv 10 - Vânătoare de obiecte</div>
          <div class="text-sm text-gray-500 mt-1">Găsiți și fotografiați fiecare element — ${HUNT_POINTS} puncte pentru fiecare găsit.</div>
        </div>
      </div>
      <div class="space-y-3">
        ${HUNT_ITEMS.map(item => {
          const hid = `hunt-${item.id}`;
          const sub = submissions[hid];
          return `
            <div class="border border-gray-100 rounded-xl p-3" data-task="${hid}">
              <div class="flex items-center justify-between gap-2 mb-2">
                <div class="text-sm font-semibold text-gray-700">${item.label}</div>
                ${statusPillHtml(sub?.score, HUNT_POINTS, !!sub)}
              </div>
              ${sub?.content ? `<img src="${sub.content}" class="w-full max-h-40 object-cover rounded-lg mb-2 border border-gray-100">` : ""}
              <label class="inline-flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-lg border-2 border-[#009639] text-[#009639] hover:bg-[#e8f5ed] cursor-pointer transition-colors">
                📷 ${sub ? "Înlocuiește" : "Încarcă poza"}
                <input type="file" accept="image/*" capture="environment" class="hidden photoInput">
              </label>
              <span class="statusMsg text-xs text-gray-400 ml-2"></span>
            </div>`;
        }).join("")}
      </div>
    </div>`;

  app.innerHTML = headerHtml(`${team.emoji} ${team.name}`, "Spațiul echipei tale", true) +
    summary + taskCards + huntCard;

  document.getElementById("backBtn").onclick = () => { teardownChat(); state.team = null; state.authed = false; renderTeamPicker(); };
  document.getElementById("viewBoardBtn").onclick = () => renderLeaderboard();

  document.querySelectorAll("[data-task]").forEach(card => {
    const taskId = card.dataset.task;
    const isHunt = taskId.startsWith("hunt-");
    const task = isHunt ? null : TASKS.find(t => t.id === taskId);
    const maxPoints = isHunt ? HUNT_POINTS : task.points;
    const needsText = !isHunt && task.needsText;

    const input = card.querySelector(".photoInput");
    const statusEl = card.querySelector(".statusMsg");
    const textInput = card.querySelector(".textInput");

    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      statusEl.textContent = "Se trimite...";
      try {
        const url = await uploadPhoto(team.id, taskId, file);
        let content = url;
        if (needsText) content = JSON.stringify({ url, answer: textInput ? textInput.value.trim() : "" });
        const { error } = await supabase.from("submissions").upsert({
          team_id: team.id, task_id: taskId,
          type: needsText ? "photo_text" : "photo",
          content, max_points: maxPoints, score: null
        }, { onConflict: "team_id,task_id" });
        if (error) throw error;
        const fresh = await fetchSubmissions(team.id);
        drawPlayerTasks(team, fresh);
      } catch (e) {
        statusEl.textContent = "Eroare — încearcă din nou.";
        console.error(e);
      }
    };

    if (textInput) {
      textInput.onblur = async () => {
        const existing = submissions[taskId];
        if (!existing) return;
        try {
          const parsed = JSON.parse(existing.content);
          parsed.answer = textInput.value.trim();
          const { error } = await supabase.from("submissions").update({ content: JSON.stringify(parsed) }).eq("team_id", team.id).eq("task_id", taskId);
          if (error) throw error;
        } catch (e) { console.error(e); }
      };
    }
  });
}

// ---------- REFEREE SCREEN ----------
async function renderRefereeScreen() {
  cleanupRealtime();
  const team = state.team;
  app.innerHTML = headerHtml(`${team.emoji} ${team.name}`, "Panou de arbitraj — doar această echipă", true) +
    `<div class="flex justify-center py-12 text-gray-400">Se încarcă...</div>`;
  document.getElementById("backBtn").onclick = () => { teardownChat(); state.team = null; state.authed = false; renderTeamPicker(); };

  const submissions = await fetchSubmissions(team.id);
  drawRefereeTasks(team, submissions);
  setupChat(team.id, "referee", `${team.emoji} ${team.name}`, team.emoji);
}

function scoreButtonsHtml(taskId, maxPoints, currentScore) {
  const approved = currentScore !== null && currentScore !== undefined && currentScore >= maxPoints;
  const rejected = currentScore === 0;
  return `
    <div class="flex items-center gap-2 mt-2" data-score-controls="${taskId}" data-max="${maxPoints}">
      <button class="approveBtn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${approved ? "bg-[#009639] text-white" : "bg-[#e8f5ed] text-[#007a2e] hover:bg-[#009639] hover:text-white"}">
        ✅ Acordă ${maxPoints} puncte
      </button>
      <button class="rejectBtn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${rejected ? "bg-red-500 text-white" : "bg-red-50 text-red-500 hover:bg-red-500 hover:text-white"}">
        ❌ Fără punctaj
      </button>
    </div>`;
}

function drawRefereeTasks(team, submissions) {
  const totalScore = Object.values(submissions).reduce((s, sub) => s + (sub.score || 0), 0);

  const summary = `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 flex items-center justify-between">
      <div>
        <div class="text-xs uppercase tracking-wide text-gray-400 font-bold">Scor echipă</div>
        <div class="text-2xl font-bold text-[#009639]">${totalScore} pct</div>
      </div>
      <button id="viewBoardBtn" class="text-sm font-semibold text-[#7a8c00] hover:underline">🏆 Vezi clasamentul</button>
    </div>`;

  const taskCards = TASKS.map(task => {
    const sub = submissions[task.id];
    let photoUrl = null, textAnswer = "";
    if (sub) {
      if (task.needsText) {
        try { const parsed = JSON.parse(sub.content); photoUrl = parsed.url; textAnswer = parsed.answer || ""; }
        catch (e) { photoUrl = sub.content; }
      } else {
        photoUrl = sub.content;
      }
    }
    return `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4" data-task="${task.id}">
        <div class="flex items-start justify-between gap-3 mb-2">
          <div>
            <div class="font-bold text-gray-800">${task.title}</div>
            <div class="text-sm text-gray-500 mt-1">${task.prompt}</div>
          </div>
          ${statusPillHtml(sub?.score, task.points, !!sub)}
        </div>
        ${!sub ? `<div class="text-sm text-gray-400 mt-3 bg-gray-50 rounded-lg p-3">Echipa nu a trimis încă această probă.</div>` : ""}
        ${photoUrl ? `<img src="${photoUrl}" class="w-full max-h-64 object-cover rounded-xl mt-3 mb-2 border border-gray-100">` : ""}
        ${task.needsText && sub ? `<div class="text-sm bg-gray-50 rounded-lg p-3 mb-2 text-gray-700"><span class="font-semibold">${task.textLabel}:</span> ${textAnswer || "—"}</div>` : ""}
        ${sub ? scoreButtonsHtml(task.id, task.points, sub.score) : ""}
      </div>`;
  }).join("");

  const huntCard = `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-4">
      <div class="font-bold text-gray-800 mb-3">Obiectiv 10 - Vânătoare de obiecte</div>
      <div class="space-y-3">
        ${HUNT_ITEMS.map(item => {
          const hid = `hunt-${item.id}`;
          const sub = submissions[hid];
          return `
            <div class="border border-gray-100 rounded-xl p-3" data-task="${hid}">
              <div class="flex items-center justify-between gap-2 mb-2">
                <div class="text-sm font-semibold text-gray-700">${item.label}</div>
                ${statusPillHtml(sub?.score, HUNT_POINTS, !!sub)}
              </div>
              ${sub?.content ? `<img src="${sub.content}" class="w-full max-h-40 object-cover rounded-lg mb-2 border border-gray-100">` : `<div class="text-xs text-gray-400">Nu a fost trimisă poză.</div>`}
              ${sub ? scoreButtonsHtml(hid, HUNT_POINTS, sub.score) : ""}
            </div>`;
        }).join("")}
      </div>
    </div>`;

  app.innerHTML = headerHtml(`${team.emoji} ${team.name}`, "Panou de arbitraj — doar această echipă", true) +
    summary + taskCards + huntCard;

  document.getElementById("backBtn").onclick = () => { teardownChat(); state.team = null; state.authed = false; renderTeamPicker(); };
  document.getElementById("viewBoardBtn").onclick = () => renderLeaderboard();

  document.querySelectorAll("[data-score-controls]").forEach(ctrl => {
    const taskId = ctrl.dataset.scoreControls;
    const maxPoints = Number(ctrl.dataset.max);
    const approveBtn = ctrl.querySelector(".approveBtn");
    const rejectBtn = ctrl.querySelector(".rejectBtn");

    const setScore = async (score) => {
      approveBtn.disabled = true; rejectBtn.disabled = true;
      try {
        const { error } = await supabase.from("submissions").update({ score }).eq("team_id", team.id).eq("task_id", taskId);
        if (error) throw error;
        const fresh = await fetchSubmissions(team.id);
        drawRefereeTasks(team, fresh);
      } catch (e) {
        console.error(e);
        approveBtn.disabled = false; rejectBtn.disabled = false;
      }
    };
    approveBtn.onclick = () => setScore(maxPoints);
    rejectBtn.onclick = () => setScore(0);
  });
}

renderRoleSelect();
</script>
