const BONUSES = [
  { key: "green", emoji: "🟢", label: "Ceva verde", points: 2 },
  { key: "funny", emoji: "🎭", label: "Amuzantă", points: 3 },
  { key: "creative", emoji: "🌟", label: "Cea mai creativă", points: 10 },
];

function computeTotal(approved, maxPoints, bonuses) {
  const base = approved ? maxPoints : 0;
  const bonusSum = BONUSES.reduce((s, b) => s + (bonuses && bonuses[b.key] ? b.points : 0), 0);
  return base + bonusSum;
}

const app = document.getElementById("app");
let state = { role: null, team: null, authed: false };
let realtimeChannel = null;

// ---------- CHAT WIDGET (floating, separate from page content) ----------
const chatRoot = document.getElementById("chatWidgetRoot");
const toastRoot = document.getElementById("toastRoot");

let chatMode = null;           // "single" (player) | "inbox" (referee)
let chatOpen = false;
let chatRealtimeChannel = null;
let chatPollId = null;

// single mode (player)
let singleCtx = null;          // { teamId, counterpartLabel, counterpartEmoji }
let singleMessages = [];
let singleUnread = 0;

// inbox mode (referee)
let inboxThreads = {};         // teamId -> { messages: [], unread: 0 }
let activeThreadTeamId = null; // null = list view

function totalUnread() {
  if (chatMode === "single") return singleUnread;
  if (chatMode === "inbox") return Object.values(inboxThreads).reduce((s, t) => s + t.unread, 0);
  return 0;
}

function showToast(text) {
  const el = document.createElement("div");
  el.className = "toast bg-white border border-gray-200 shadow-lg rounded-xl px-4 py-3 max-w-xs text-sm flex items-start gap-2";
  el.innerHTML = `<span class="text-lg">💬</span><span class="text-gray-700">${escapeHtml(text)}</span>`;
  toastRoot.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity 0.4s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 400); }, 4000);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function updateBadge() {
  const badge = document.getElementById("chatBadge");
  if (!badge) return;
  const n = totalUnread();
  badge.textContent = n > 99 ? "99+" : n;
  badge.classList.toggle("hidden", n === 0);
}

function renderChatWidget() {
  if (!chatMode) { chatRoot.innerHTML = ""; return; }
  chatRoot.innerHTML = `
    <div class="fixed bottom-5 right-5 z-40 flex flex-col items-end gap-3">
      <div id="chatPanel" class="hidden fixed inset-0 sm:inset-auto sm:bottom-24 sm:right-5 w-full sm:w-80 h-full sm:h-auto sm:max-h-[32rem] bg-white rounded-none sm:rounded-2xl shadow-2xl border border-gray-200 overflow-hidden z-50 flex-col"></div>
      <button id="chatBubbleBtn" class="relative w-14 h-14 rounded-full bg-[#009639] text-white text-2xl shadow-xl hover:bg-[#007a2e] transition-colors flex items-center justify-center">
        💬
        <span id="chatBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center hidden"></span>
      </button>
    </div>`;
  document.getElementById("chatBubbleBtn").onclick = toggleChatPanel;
  updateBadge();
  drawPanelContent();
}

function toggleChatPanel() {
  chatOpen = !chatOpen;
  const panel = document.getElementById("chatPanel");
  if (panel) {
    panel.classList.toggle("hidden", !chatOpen);
    panel.classList.toggle("flex", chatOpen);
  }
  if (chatOpen) {
    if (chatMode === "single") {
      singleUnread = 0;
    } else if (chatMode === "inbox" && activeThreadTeamId) {
      inboxThreads[activeThreadTeamId].unread = 0;
    }
    updateBadge();
    drawPanelContent();
  }
}

function threadHeaderHtml(emoji, label, showBackToInbox) {
  return `
    <div class="shrink-0 bg-gradient-to-r from-[#009639] to-[#007a2e] text-white px-4 py-3 flex items-center gap-2">
      ${showBackToInbox ? `<button id="chatBackBtn" class="text-white/80 hover:text-white text-lg leading-none mr-1">&larr;</button>` : ""}
      <span class="text-xl">${emoji}</span>
      <div>
        <div class="text-xs uppercase tracking-wide opacity-80 font-bold">Conversație cu</div>
        <div class="font-bold text-sm">${label}</div>
      </div>
      <button id="chatCloseBtn" title="Minimizează" class="ml-auto text-white/80 hover:text-white text-xl leading-none">&#8964;</button>
    </div>`;
}

function messageBubblesHtml(messages, viewerRole) {
  if (messages.length === 0) {
    return `<div class="text-xs text-gray-400 text-center mt-6">Niciun mesaj încă. Scrie primul!</div>`;
  }
  return messages.map(m => {
    const mine = m.sender === viewerRole;
    const label = m.sender === "referee" ? "Arbitru" : "Echipă";
    return `
      <div class="flex ${mine ? "justify-end" : "justify-start"}">
        <div class="max-w-[80%] rounded-xl px-3 py-2 text-sm ${mine ? "bg-[#009639] text-white" : "bg-gray-100 text-gray-700"}">
          <div class="text-[10px] uppercase tracking-wide font-bold opacity-70 mb-0.5">${label}</div>
          ${escapeHtml(m.content)}
        </div>
      </div>`;
  }).join("");
}

function drawPanelContent() {
  const panel = document.getElementById("chatPanel");
  if (!panel) return;

  if (chatMode === "single") {
    panel.innerHTML =
      threadHeaderHtml(singleCtx.counterpartEmoji, singleCtx.counterpartLabel, false) +
      `<div id="chatMessages" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-2 p-3">${messageBubblesHtml(singleMessages, "player")}</div>
       <div class="shrink-0 flex gap-2 p-3 border-t border-gray-100">
         <input id="chatInput" type="text" placeholder="Scrie un mesaj..." class="flex-1 min-w-0 text-sm border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#009639] focus:outline-none">
         <button id="chatSend" class="shrink-0 px-3 py-2 rounded-lg bg-[#009639] text-white text-sm font-semibold hover:bg-[#007a2e] transition-colors">➤</button>
       </div>`;
    wireCloseAndSend("player", () => singleCtx.teamId);
    const box = document.getElementById("chatMessages");
    if (box && chatOpen) box.scrollTop = box.scrollHeight;
    return;
  }

  // inbox mode (referee)
  if (!activeThreadTeamId) {
    const rows = TEAMS.map(t => {
      const thread = inboxThreads[t.id] || { messages: [], unread: 0 };
      const last = thread.messages[thread.messages.length - 1];
      const preview = last ? (last.sender === "referee" ? "Tu: " : "") + last.content : "Niciun mesaj încă";

            <div class="font-semibold text-sm text-gray-800 truncate">${t.name}</div>

          </div>

        </button>`;
    }).join("");
    panel.innerHTML = `
      <div class="shrink-0 bg-gradient-to-r from-[#009639] to-[#007a2e] text-white px-4 py-3 flex items-center gap-2">
        <span class="text-xl">🛡️</span>
        <div class="font-bold text-sm">Conversații cu echipele</div>
        <button id="chatCloseBtn" title="Minimizează" class="ml-auto text-white/80 hover:text-white text-xl leading-none">&#8964;</button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto">${rows}</div>`;
    document.getElementById("chatCloseBtn").onclick = () => { chatOpen = false; syncClose(); };
    panel.querySelectorAll(".inboxRow").forEach(row => {
      row.onclick = () => {
        activeThreadTeamId = row.dataset.team;
        inboxThreads[activeThreadTeamId].unread = 0;
        updateBadge();
        drawPanelContent();
      };
    });
    return;
  }

  const team = TEAMS.find(t => t.id === activeThreadTeamId);
  const thread = inboxThreads[activeThreadTeamId];
  panel.innerHTML =
    threadHeaderHtml(team.emoji, team.name, true) +
    `<div id="chatMessages" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-2 p-3">${messageBubblesHtml(thread.messages, "referee")}</div>
     <div class="shrink-0 flex gap-2 p-3 border-t border-gray-100">
       <input id="chatInput" type="text" placeholder="Scrie un mesaj..." class="flex-1 min-w-0 text-sm border-2 border-gray-200 rounded-lg px-3 py-2 focus:border-[#009639] focus:outline-none">
       <button id="chatSend" class="shrink-0 px-3 py-2 rounded-lg bg-[#009639] text-white text-sm font-semibold hover:bg-[#007a2e] transition-colors">➤</button>
     </div>`;
  document.getElementById("chatBackBtn").onclick = () => { activeThreadTeamId = null; drawPanelContent(); };
  wireCloseAndSend("referee", () => activeThreadTeamId);
  const box = document.getElementById("chatMessages");
  if (box && chatOpen) box.scrollTop = box.scrollHeight;
}

function syncClose() {
  const panel = document.getElementById("chatPanel");
  if (panel) panel.classList.add("hidden");
}

function wireCloseAndSend(viewerRole, getTeamId) {
  const closeBtn = document.getElementById("chatCloseBtn");
  if (closeBtn) closeBtn.onclick = () => { chatOpen = false; syncClose(); };
  const sendBtn = document.getElementById("chatSend");
  const input = document.getElementById("chatInput");
  const send = async () => {
    const text = input.value.trim();
    const teamId = getTeamId();
    if (!text || !teamId) return;
    input.value = "";
    try {
      await supabase.from("messages").insert({ team_id: teamId, sender: viewerRole, content: text });
    } catch (e) { console.error(e); }
  };
  if (sendBtn) sendBtn.onclick = send;
  if (input) input.onkeydown = (e) => { if (e.key === "Enter") send(); };
}

async function loadChatHistory(teamId) {
  const { data, error } = await supabase.from("messages").select("*").eq("team_id", teamId).order("created_at", { ascending: true });
  if (error) { console.error(error); return []; }
  return data;
}

function teardownChat() {
  if (chatRealtimeChannel) { supabase.removeChannel(chatRealtimeChannel); chatRealtimeChannel = null; }
  if (chatPollId) { clearInterval(chatPollId); chatPollId = null; }
  chatMode = null;
  chatOpen = false;
  singleCtx = null;
  singleMessages = [];
  singleUnread = 0;
  inboxThreads = {};
  activeThreadTeamId = null;
  chatRoot.innerHTML = "";
}

// ---- player: single-thread chat with their own team's referee ----
async function setupChat(teamId, counterpartLabel, counterpartEmoji) {
  teardownChat();
  chatMode = "single";
  singleCtx = { teamId, counterpartLabel, counterpartEmoji };
  singleMessages = await loadChatHistory(teamId);
  renderChatWidget();

  const handleIncoming = (msg) => {
    if (singleMessages.some(m => m.id === msg.id)) return;
    singleMessages.push(msg);
    if (msg.sender !== "player") {
      if (!chatOpen) { singleUnread += 1; updateBadge(); }
      showToast(`Mesaj nou de la ${counterpartLabel}: "${msg.content.slice(0, 60)}"`);
    }
    if (chatOpen) drawPanelContent();
  };

  chatRealtimeChannel = supabase
    .channel(`chat-player-${teamId}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `team_id=eq.${teamId}` }, (payload) => handleIncoming(payload.new))
    .subscribe();

  chatPollId = setInterval(async () => {
    const fresh = await loadChatHistory(teamId);
    const newOnes = fresh.filter(f => !singleMessages.some(m => m.id === f.id));
    newOnes.forEach(handleIncoming);
  }, 4000);
}

// ---- referee: Messenger-style inbox across all teams ----
async function setupRefereeInbox() {
  teardownChat();
  chatMode = "inbox";
  for (const t of TEAMS) inboxThreads[t.id] = { messages: [], unread: 0 };

  const all = await Promise.all(TEAMS.map(t => loadChatHistory(t.id)));
  TEAMS.forEach((t, i) => { inboxThreads[t.id].messages = all[i]; });

  renderChatWidget();

  const handleIncoming = (msg) => {
    const thread = inboxThreads[msg.team_id];
    if (!thread) return;
    if (thread.messages.some(m => m.id === msg.id)) return;
    thread.messages.push(msg);
    if (msg.sender === "player") {
      const isViewingThisThread = chatOpen && activeThreadTeamId === msg.team_id;
      if (!isViewingThisThread) {
        thread.unread += 1;
        updateBadge();
      }
      const teamName = TEAMS.find(t => t.id === msg.team_id)?.name || "o echipă";
      showToast(`Mesaj nou de la ${teamName}: "${msg.content.slice(0, 60)}"`);
    }
    if (chatOpen) drawPanelContent();
  };

  chatRealtimeChannel = supabase
    .channel(`chat-referee-inbox`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => handleIncoming(payload.new))
    .subscribe();

  chatPollId = setInterval(async () => {
    for (const t of TEAMS) {
      const fresh = await loadChatHistory(t.id);
      const thread = inboxThreads[t.id];
      const newOnes = fresh.filter(f => !thread.messages.some(m => m.id === f.id));
      newOnes.forEach(handleIncoming);
    }
  }, 4000);
}

// ---------- ACTIVITY FEED (referee only) ----------
const activityRoot = document.getElementById("activityWidgetRoot");
let activityItems = [];
let activityOpen = false;
let activityUnread = 0;
let activityRealtimeChannel = null;
let activityPollId = null;
let activityKnown = {}; // submission id -> { content, updated_at } — full cache so poll can detect changes on its own
const recentSelfUpdates = new Set(); // "teamId:taskId" keys the referee just scored, to suppress self-notifications

function markSelfUpdate(teamId, taskId) {
  const key = `${teamId}:${taskId}`;
  recentSelfUpdates.add(key);
  setTimeout(() => recentSelfUpdates.delete(key), 5000);
}

function getTaskInfo(taskId) {
  if (taskId.startsWith("hunt-")) {
    const item = HUNT_ITEMS.find(h => `hunt-${h.id}` === taskId);
    return { title: `Vânătoare de obiecte — ${item ? item.label : taskId}` };
  }
  const task = TASKS.find(t => t.id === taskId);
  return { title: task ? task.title : taskId };
}

function timeAgo(iso) {
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "acum";
  if (mins < 60) return `acum ${mins} min`;
  const hrs = Math.floor(mins / 60);
  return `acum ${hrs} h`;
}

function updateActivityBadge() {
  const badge = document.getElementById("activityBadge");
  if (!badge) return;
  badge.textContent = activityUnread > 99 ? "99+" : activityUnread;
  badge.classList.toggle("hidden", activityUnread === 0);
}

function renderActivityWidget() {
  activityRoot.innerHTML = `
    <div class="fixed bottom-5 right-24 z-40">
      <div id="activityPanel" class="hidden fixed inset-0 sm:inset-auto sm:bottom-24 sm:right-24 w-full sm:w-80 h-full sm:h-auto sm:max-h-[32rem] bg-white rounded-none sm:rounded-2xl shadow-2xl border border-gray-200 overflow-hidden z-50 flex-col"></div>
      <button id="activityBubbleBtn" class="relative w-14 h-14 rounded-full bg-[#ff9800] text-white text-2xl shadow-xl hover:bg-[#e65100] transition-colors flex items-center justify-center">
        🔔
        <span id="activityBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center hidden"></span>
      </button>
    </div>`;
  document.getElementById("activityBubbleBtn").onclick = toggleActivityPanel;
  updateActivityBadge();
  drawActivityList();
}

function toggleActivityPanel() {
  activityOpen = !activityOpen;
  const panel = document.getElementById("activityPanel");
  if (panel) {
    panel.classList.toggle("hidden", !activityOpen);
    panel.classList.toggle("flex", activityOpen);
  }
  if (activityOpen) {
    activityUnread = 0;
    updateActivityBadge();
  }
  drawActivityList();
}

function drawActivityList() {
  const panel = document.getElementById("activityPanel");
  if (!panel) return;
  const rows = activityItems.length === 0
    ? `<div class="text-xs text-gray-400 text-center mt-8 px-4">Nicio activitate încă.</div>`
    : activityItems.map(item => `
        <button class="activityRow w-full flex items-start gap-3 px-4 py-3 hover:bg-gray-50 transition-colors text-left border-b border-gray-50" data-team="${item.teamId}">
          <span class="text-xl">${item.emoji}</span>
          <div class="flex-1 min-w-0">
            <div class="text-sm text-gray-800"><span class="font-semibold">${item.teamName}</span> a trimis pentru <span class="font-semibold">${escapeHtml(item.taskTitle)}</span></div>
            <div class="text-xs text-gray-400 mt-0.5">${timeAgo(item.at)}</div>
          </div>
        </button>`).join("");
  panel.innerHTML = `
    <div class="shrink-0 bg-gradient-to-r from-[#ff9800] to-[#e65100] text-white px-4 py-3 flex items-center gap-2">
      <span class="text-xl">🔔</span>
      <div class="font-bold text-sm">Activitate echipe</div>
      <button id="activityCloseBtn" title="Minimizează" class="ml-auto text-white/80 hover:text-white text-xl leading-none">&#8964;</button>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto">${rows}</div>`;
  document.getElementById("activityCloseBtn").onclick = () => { activityOpen = false; const p = document.getElementById("activityPanel"); if (p) p.classList.add("hidden"); };
  panel.querySelectorAll(".activityRow").forEach(row => {
    row.onclick = () => {
      const team = TEAMS.find(t => t.id === row.dataset.team);
      if (!team) return;
      activityOpen = false;
      const p = document.getElementById("activityPanel");
      if (p) p.classList.add("hidden");
      state.team = team;
      renderRefereeScreen();
    };
  });
}

function pushActivity(row) {
  const team = TEAMS.find(t => t.id === row.team_id);
  if (!team) return;
  const info = getTaskInfo(row.task_id);
  activityItems.unshift({
    teamId: row.team_id, teamName: team.name, emoji: team.emoji,
    taskTitle: info.title, at: row.updated_at || row.submitted_at || new Date().toISOString(),
  });
  activityItems = activityItems.slice(0, 30);
  if (!activityOpen) { activityUnread += 1; updateActivityBadge(); }
  showToast(`${team.emoji} ${team.name} a trimis pentru ${info.title}`);
  if (activityOpen) drawActivityList();
}

// Central place that decides "is this row worth notifying about right now?" —
// used by both the realtime handlers AND the poll fallback, so notifications
// work reliably even if Realtime isn't wired up correctly.
function evaluateSubmissionForActivity(row, { isBrandNew }) {
  const cached = activityKnown[row.id];
  activityKnown[row.id] = { content: row.content, updated_at: row.updated_at };

  if (isBrandNew || !cached) {
    // a genuinely new submission from a team
    pushActivity(row);
    return;
  }
  if (cached.updated_at === row.updated_at) return; // nothing actually changed
  if (cached.content === row.content) return; // only score/approved/bonuses changed — not activity-worthy

  const selfKey = `${row.team_id}:${row.task_id}`;
  if (recentSelfUpdates.has(selfKey)) return; // this referee just scored it — don't self-notify

  pushActivity(row);
}

async function setupRefereeActivity() {
  teardownActivity();
  const { data } = await supabase.from("submissions").select("*").order("updated_at", { ascending: false }).limit(30);
  (data || []).forEach(row => { activityKnown[row.id] = { content: row.content, updated_at: row.updated_at }; });
  (data || []).slice(0, 10).reverse().forEach(row => {
    const team = TEAMS.find(t => t.id === row.team_id);
    if (!team) return;
    const info = getTaskInfo(row.task_id);
    activityItems.unshift({ teamId: row.team_id, teamName: team.name, emoji: team.emoji, taskTitle: info.title, at: row.updated_at });
  });
  activityItems = activityItems.slice(0, 30);
  renderActivityWidget();

  activityRealtimeChannel = supabase
    .channel("referee-activity")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "submissions" }, (payload) => {
      evaluateSubmissionForActivity(payload.new, { isBrandNew: !(payload.new.id in activityKnown) });
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "submissions" }, (payload) => {
      evaluateSubmissionForActivity(payload.new, { isBrandNew: false });
    })
    .subscribe();

  // Poll fallback — fully self-sufficient, doesn't rely on Realtime having fired first.
  activityPollId = setInterval(async () => {
    const { data: fresh } = await supabase.from("submissions").select("*").order("updated_at", { ascending: false }).limit(30);
    (fresh || []).forEach(row => {
      const isBrandNew = !(row.id in activityKnown);
      evaluateSubmissionForActivity(row, { isBrandNew });
    });
  }, 5000);
}

function teardownActivity() {
  if (activityRealtimeChannel) { supabase.removeChannel(activityRealtimeChannel); activityRealtimeChannel = null; }
  if (activityPollId) { clearInterval(activityPollId); activityPollId = null; }
  activityItems = [];
  activityUnread = 0;
  activityOpen = false;
  activityKnown = {};
  activityRoot.innerHTML = "";
}

// ---------- LIGHTBOX (full image view + download, referee only) ----------
function openLightbox(url) {
  const overlay = document.createElement("div");
  overlay.id = "lightboxOverlay";
  overlay.className = "fixed inset-0 bg-black/90 z-[60] flex flex-col items-center justify-center p-4";
  overlay.innerHTML = `
    <button id="lightboxClose" class="absolute top-4 right-4 text-white text-3xl leading-none">&times;</button>
    <img src="${url}" class="max-w-full max-h-[75vh] rounded-lg shadow-2xl object-contain">
    <button id="lightboxDownload" class="mt-5 px-5 py-2.5 rounded-lg bg-[#009639] text-white font-semibold hover:bg-[#007a2e] transition-colors">⬇ Descarcă poza</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById("lightboxClose").onclick = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("lightboxDownload").onclick = async (e) => {
    const btn = e.currentTarget;
    btn.textContent = "Se descarcă...";
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = url.split("/").pop() || "poza.jpg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
      btn.textContent = "⬇ Descarcă poza";
    } catch (err) {
      console.error(err);
      window.open(url, "_blank");
      btn.textContent = "⬇ Descarcă poza";
    }
  };
}

function wireLightboxImages() {
  document.querySelectorAll(".lightboxImg").forEach(img => {
    img.style.cursor = "zoom-in";
    img.onclick = () => openLightbox(img.dataset.url || img.src);
  });
}

// ---------- DATA HELPERS ----------
async function fetchSubmissions(teamId) {
  const { data, error } = await supabase.from("submissions").select("*").eq("team_id", teamId);
  if (error) { console.error(error); return {}; }
  const map = {};
  for (const row of data) map[row.task_id] = row;
  return map;
}

async function compressImage(file, maxWidth = 900, quality = 0.65) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(teamId, taskId, file) {
  const blob = await compressImage(file);
  const path = `${teamId}/${taskId}-${Date.now()}.jpg`;
  const { error: upErr } = await supabase.storage.from("submissions").upload(path, blob, { contentType: "image/jpeg" });
  if (upErr) throw upErr;
  const { data: pub } = supabase.storage.from("submissions").getPublicUrl(path);
  return pub.publicUrl;
}

// ---------- LEADERBOARD ----------
async function computeLeaderboard() {
  const { data, error } = await supabase.from("submissions").select("team_id, score");
  if (error) { console.error(error); return []; }
  const totals = {};
  for (const t of TEAMS) totals[t.id] = 0;
  for (const row of data) {
    if (row.score) totals[row.team_id] = (totals[row.team_id] || 0) + row.score;
  }
  return TEAMS.map(t => ({ ...t, score: totals[t.id] || 0 })).sort((a, b) => b.score - a.score);
}

let scoreWatcherChannel = null;
let scoreWatcherPollId = null;
let lastKnownApproved = {};
let popupQueue = [];
let popupShowing = false;

function processPopupQueue(team) {
  if (popupShowing || popupQueue.length === 0) return;
  popupShowing = true;
  const item = popupQueue.shift();
  showScorePopup(item.title, item.approved, item.points, async () => {
    popupShowing = false;
    const fresh = await fetchSubmissions(team.id);
    drawPlayerTasks(team, fresh);
    processPopupQueue(team);
  });
}

function checkForNewlyScored(team, submissions) {
  TASKS.forEach(task => {
    const sub = submissions[task.id];
    const wasApproved = lastKnownApproved[task.id];
    const nowApproved = sub ? sub.approved : undefined;
    const known = task.id in lastKnownApproved;
    lastKnownApproved[task.id] = nowApproved;
    if (known && (wasApproved === null || wasApproved === undefined) && (nowApproved !== null && nowApproved !== undefined)) {
      popupQueue.push({ title: task.title, approved: nowApproved, points: sub.score || 0 });
    }
  });
  processPopupQueue(team);
}

function setupScoreWatcher(team, initialSubmissions) {
  teardownScoreWatcher();
  TASKS.forEach(task => {
    const sub = initialSubmissions[task.id];
    lastKnownApproved[task.id] = sub ? sub.approved : undefined;
  });

  scoreWatcherChannel = supabase
    .channel(`score-watch-${team.id}`)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "submissions", filter: `team_id=eq.${team.id}` }, async () => {
      const fresh = await fetchSubmissions(team.id);
      checkForNewlyScored(team, fresh);
    })
    .subscribe();

  scoreWatcherPollId = setInterval(async () => {
    const fresh = await fetchSubmissions(team.id);
    checkForNewlyScored(team, fresh);
  }, 4000);
}

function teardownScoreWatcher() {
  if (scoreWatcherChannel) { supabase.removeChannel(scoreWatcherChannel); scoreWatcherChannel = null; }
  if (scoreWatcherPollId) { clearInterval(scoreWatcherPollId); scoreWatcherPollId = null; }
  lastKnownApproved = {};
  popupQueue = [];
  popupShowing = false;
}

        try {
          const score = computeTotal(sub.approved === true, task.points, bonuses);
          const { error } = await supabase.from("submissions").update({ bonuses, score }).eq("team_id", team.id).eq("task_id", taskId);
          if (error) throw error;
          const fresh = await fetchSubmissions(team.id);
          drawRefereeTasks(team, fresh);
        } catch (e) {
          console.error(e);
          btn.disabled = false;
        }
      };
    });
  });
}

renderRoleSelect();
</script>
