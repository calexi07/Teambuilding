<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Super Stars Night — Jurizare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-0:#0f0a24;
    --bg-1:#1a1140;
    --bg-2:#241456;
    --violet:#8b3ffb;
    --violet-soft:#7b2ff7;
    --magenta:#ff4fa3;
    --gold:#ffd76a;
    --gold-deep:#f0b429;
    --ink:#fbf8ff;
    --lavender:#b9a9de;
    --lavender-dim:#8577ab;
    --card:rgba(255,255,255,0.055);
    --card-border:rgba(255,255,255,0.13);
    --card-border-lit:rgba(255,215,106,0.55);
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,79,163,0.20), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(139,63,251,0.30), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255,215,106,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .noise{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:3px 3px;
  }
  #app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  .num{font-family:'Space Grotesk', monospace;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--gold); color:#221238;}

  /* ---------- top corner nav ---------- */
  .corner-nav{position:fixed; top:16px; left:16px; z-index:20; display:flex; gap:8px; align-items:center;}
  .corner-btn{
    background:rgba(20,12,45,0.6); border:1px solid var(--card-border);
    color:var(--lavender); padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:600; backdrop-filter:blur(6px);
    transition:all .15s ease;
  }
  .corner-btn:hover{border-color:var(--card-border-lit); color:var(--gold);}

  /* ---------- HOME ---------- */
  .home{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 24px;}
  .home .eyebrow{letter-spacing:.3em; text-transform:uppercase; font-size:12px; color:var(--lavender); font-weight:700; margin-bottom:18px;}
  .home h1{
    font-size:clamp(38px, 7vw, 76px); margin:0; line-height:1;
    background:linear-gradient(100deg, var(--gold) 10%, #fff 35%, var(--magenta) 60%, var(--violet-soft) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(255,215,106,0.25);
  }
  .home .sub{color:var(--lavender); margin-top:14px; font-size:16px;}
  .home .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:18px; margin-top:52px; max-width:820px; width:100%;}
  .nav-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
    padding:28px 20px; transition:all .18s ease; display:flex; flex-direction:column; gap:10px;
    align-items:center; text-align:center;
  }
  .nav-card:hover{transform:translateY(-4px); border-color:var(--card-border-lit); box-shadow:0 12px 30px rgba(139,63,251,0.25);}
  .nav-card .ic{font-size:34px;}
  .nav-card .t{font-family:'Baloo 2'; font-size:19px; font-weight:700;}
  .nav-card .d{font-size:13px; color:var(--lavender-dim);}

  /* ---------- shared page shell ---------- */
  .page{flex:1; padding:80px 20px 40px; max-width:1180px; margin:0 auto; width:100%;}
  .page-header{text-align:center; margin-bottom:28px;}
  .page-header .eyebrow{letter-spacing:.25em; text-transform:uppercase; font-size:11px; color:var(--lavender-dim); font-weight:700;}
  .page-header h2{font-size:clamp(24px,4vw,38px); margin:6px 0 0;}

  /* ---------- SCREEN: name-only ---------- */
  .screen-name{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .screen-name .tag{letter-spacing:.35em; text-transform:uppercase; font-size:15px; color:var(--gold); font-weight:700; margin-bottom:22px;}
  .screen-name .ic{font-size:clamp(60px,10vw,120px); filter:drop-shadow(0 0 20px rgba(255,215,106,0.45)); margin-bottom:10px;}
  .screen-name h1{
    font-size:clamp(48px, 10vw, 120px); margin:0; line-height:1;
    background:linear-gradient(100deg, #fff 10%, var(--gold) 55%, var(--magenta) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* ---------- SCREEN: video ---------- */
  .screen-video{position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:15;}
  .screen-video video{width:100%; height:100%; object-fit:contain;}
  .screen-video .empty{color:var(--lavender); font-size:18px; text-align:center; padding:20px;}

  /* ---------- SCREEN: scores ---------- */
  .screen-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  .screen-eyebrow{display:flex; align-items:center; gap:10px; letter-spacing:.35em; text-transform:uppercase; font-size:13px; color:var(--gold); font-weight:700; margin-bottom:14px;}
  .round-badge{
    display:inline-flex; align-items:center; gap:8px; padding:8px 20px; border-radius:999px;
    background:rgba(255,79,163,0.14); border:1px solid rgba(255,79,163,0.4); color:#ffb6dc;
    font-weight:700; font-size:14px; margin-bottom:22px;
  }
  .team-display{display:flex; align-items:center; gap:22px; margin-bottom:8px;}
  .team-display .ic{font-size:clamp(40px,6vw,70px); filter:drop-shadow(0 0 16px rgba(255,215,106,0.4));}
  .team-display h1{
    font-size:clamp(40px, 8vw, 92px); margin:0; line-height:1;
    background:linear-gradient(100deg, #fff 10%, var(--gold) 55%, var(--magenta) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ring-zone{position:relative; width:min(70vw,380px); aspect-ratio:1; margin:34px auto 10px;}
  .ring-svg{position:absolute; inset:0; width:100%; height:100%;}
  .ring-line{stroke:rgba(255,255,255,0.14); stroke-width:2; transition:stroke .4s ease, filter .4s ease;}
  .ring-line.filled{stroke:var(--gold); filter:drop-shadow(0 0 5px rgba(255,215,106,0.8));}
  .ring-dot{fill:rgba(255,255,255,0.28); transition:all .4s ease;}
  .ring-dot.filled{fill:var(--gold); filter:drop-shadow(0 0 8px rgba(255,215,106,0.9));}
  .ring-core{fill:rgba(255,255,255,0.045); stroke:var(--violet); stroke-width:1.5;}
  .ring-total{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-total .n{font-size:clamp(44px,8vw,74px); font-weight:700; line-height:1;}
  .ring-total .lbl{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--lavender); margin-top:6px;}
  .crit-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; max-width:960px; width:100%; margin-top:20px;}
  .crit-card{background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:16px; transition:all .3s ease;}
  .crit-card.filled{border-color:var(--card-border-lit); background:rgba(255,215,106,0.07); box-shadow:0 0 24px rgba(255,215,106,0.12);}
  .crit-card .jn{font-size:12px; color:var(--lavender-dim); font-weight:600;}
  .crit-card .cn{font-size:13px; color:var(--lavender); margin-top:2px; min-height:16px;}
  .crit-card .sc{font-family:'Space Grotesk'; font-size:30px; font-weight:700; margin-top:6px; color:var(--gold);}
  .crit-card .sc.pending{color:var(--lavender-dim); font-size:18px;}
  .sparkle{position:fixed; pointer-events:none; font-size:20px; animation:sparkleUp 1.6s ease-out forwards; z-index:5;}
  @keyframes sparkleUp{
    0%{opacity:0; transform:translateY(0) scale(.4) rotate(0deg);}
    15%{opacity:1;}
    100%{opacity:0; transform:translateY(-140px) scale(1.1) rotate(180deg);}
  }

  /* ---------- SCREEN: song reveal ---------- */
  .screen-song{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;}
  .screen-song .who{font-size:16px; color:var(--lavender); font-weight:700; margin-bottom:6px;}
  .screen-song .tag{letter-spacing:.3em; text-transform:uppercase; font-size:14px; color:var(--gold); font-weight:700; margin-bottom:18px;}
  .screen-song .title{
    font-size:clamp(32px,6vw,58px); margin:0;
    background:linear-gradient(100deg, #fff 10%, var(--gold) 55%, var(--magenta) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .screen-song .artist{font-size:18px; color:var(--lavender); margin-top:8px;}
  .screen-song img{
    margin-top:28px; width:min(420px,80vw); aspect-ratio:1; object-fit:cover; border-radius:24px;
    border:2px solid var(--card-border-lit); box-shadow:0 0 50px rgba(255,215,106,0.25);
  }

  /* ---------- SCREEN: leaderboard ---------- */
  .lb-screen{flex:1; display:flex; flex-direction:column; align-items:center; padding:70px 24px 40px; width:100%;}
  .lb-screen h1{
    font-size:clamp(30px,5vw,54px); margin:0 0 30px;
    background:linear-gradient(100deg, var(--gold) 10%, #fff 50%, var(--magenta) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lb-list{width:100%; max-width:680px; display:flex; flex-direction:column; gap:10px;}
  .lb-row{display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px 20px;}
  .lb-row.top1{border-color:var(--gold); box-shadow:0 0 30px rgba(255,215,106,0.2);}
  .lb-row .rk{font-size:22px; width:34px;}
  .lb-row .nm{flex:1; font-weight:700; font-size:18px; text-align:left;}
  .lb-row .tt{font-family:'Space Grotesk'; font-weight:700; font-size:24px; color:var(--gold);}

  /* ---------- CONTROL ---------- */
  .tabs{display:flex; gap:10px; justify-content:center; margin-bottom:22px; flex-wrap:wrap;}
  .tab{padding:10px 22px; border-radius:999px; border:1px solid var(--card-border); background:var(--card); font-weight:700; font-size:14px; color:var(--lavender);}
  .tab.active{background:linear-gradient(100deg, var(--violet-soft), var(--magenta)); color:#fff; border-color:transparent;}
  .team-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-bottom:26px;}
  .team-pick{background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px 10px; text-align:center; font-weight:700; font-size:13px; color:var(--lavender);}
  .team-pick .ic{display:block; font-size:22px; margin-bottom:6px;}
  .team-pick.active{border-color:var(--gold); background:rgba(255,215,106,0.1); color:var(--gold); box-shadow:0 0 20px rgba(255,215,106,0.15);}
  .team-pick .status{display:block; font-size:10px; margin-top:4px; color:var(--lavender-dim); font-weight:600;}
  .team-pick.done .status{color:#7ee787;}
  .stepper{display:flex; justify-content:center; gap:10px; margin-bottom:8px;}
  .step-btn{background:var(--card); border:1px solid var(--card-border); border-radius:999px; padding:10px 20px; color:var(--ink); font-weight:700; font-size:14px;}
  .panel{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:22px; margin-bottom:22px;}
  .panel h3{margin:0 0 14px; font-size:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .crit-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px;}
  .crit-row:last-child{border-bottom:none;}
  .crit-row .who{font-weight:700;}
  .crit-row .what{color:var(--lavender-dim); font-size:12px;}
  .crit-row .val{font-family:'Space Grotesk'; font-weight:700; color:var(--gold); font-size:18px; min-width:34px; text-align:right;}
  .crit-row .val.pending{color:var(--lavender-dim); font-size:13px;}
  .mini-btn{background:rgba(255,79,163,0.12); border:1px solid rgba(255,79,163,0.4); color:#ffb6dc; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700;}
  .stage-btns{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .stage-btn{padding:9px 16px; border-radius:10px; border:1px solid var(--card-border); background:rgba(255,255,255,0.04); color:var(--lavender); font-weight:700; font-size:13px;}
  .stage-btn.active{border-color:var(--gold); color:var(--gold); background:rgba(255,215,106,0.1);}
  .field-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .field-row input[type=text], .field-row select{
    flex:1; min-width:180px; background:rgba(255,255,255,0.05); border:1px solid var(--card-border);
    color:var(--ink); padding:10px 14px; border-radius:10px; font-size:14px;
  }
  .go-btn{background:linear-gradient(100deg, var(--violet-soft), var(--magenta)); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px;}
  .save-btn{background:rgba(255,215,106,0.15); border:1px solid var(--card-border-lit); color:var(--gold); padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px;}
  .hint{font-size:12px; color:var(--lavender-dim); margin-top:8px;}
  .current-song{font-size:13px; color:var(--lavender); margin-top:6px;}
  .order-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px; border-radius:10px; transition:background .15s ease, border-color .15s ease; touch-action:none; user-select:none;}
  .order-row:last-child{border-bottom:none;}
  .order-row.dragging{background:rgba(255,215,106,0.09); border:1px solid var(--card-border-lit); box-shadow:0 10px 26px rgba(0,0,0,0.35); position:relative; z-index:50;}
  .order-row.drop-target{border-top:2px solid var(--gold);}
  .drag-handle{cursor:grab; color:var(--lavender-dim); font-size:18px; padding:4px 6px; touch-action:none; flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .order-pos{width:26px; height:26px; border-radius:50%; background:rgba(255,215,106,0.15); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;}
  .order-team{flex:1; font-weight:600;}
  .order-actions{display:flex; gap:6px;}
  .order-btn{background:var(--card); border:1px solid var(--card-border); border-radius:8px; width:32px; height:32px; color:var(--ink); font-size:13px;}
  .order-btn:disabled{opacity:.25; cursor:default;}
  table.board{width:100%; border-collapse:collapse; font-size:14px;}
  table.board th{text-align:left; color:var(--lavender-dim); font-size:11px; text-transform:uppercase; letter-spacing:.1em; padding:6px 8px;}
  table.board td{padding:10px 8px; border-top:1px solid rgba(255,255,255,0.06);}
  table.board tr td:first-child{font-weight:700;}
  .rank{display:inline-flex; width:26px;}
  .danger-zone{text-align:center; margin-top:10px;}
  .danger-btn{background:rgba(255,60,80,0.1); border:1px solid rgba(255,60,80,0.4); color:#ff8a97; padding:10px 22px; border-radius:10px; font-weight:700; font-size:13px;}

  /* ---------- JURY SELECT ---------- */
  .jury-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px;}
  .jury-card{background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:6px;}
  .jury-card:hover{border-color:var(--card-border-lit);}
  .jury-card .nm{font-family:'Baloo 2'; font-size:18px; font-weight:700;}
  .jury-card .cr{font-size:12px; color:var(--lavender);}
  .jury-card .cr b{color:var(--gold-deep);}

  /* ---------- JURY SCORE ---------- */
  .jscore{flex:1; display:flex; flex-direction:column; align-items:center; padding:78px 18px 30px; text-align:center;}
  .jname{font-size:13px; color:var(--lavender-dim); font-weight:700; text-transform:uppercase; letter-spacing:.15em;}
  .jcrit{font-family:'Baloo 2'; font-size:clamp(24px,5vw,34px); font-weight:700; margin-top:6px; color:var(--gold);}
  .jteam-tag{margin-top:22px; padding:16px 30px; border-radius:16px; background:var(--card); border:1px solid var(--card-border);}
  .jteam-tag .lbl{font-size:11px; color:var(--lavender-dim); text-transform:uppercase; letter-spacing:.15em;}
  .jteam-tag .val{font-family:'Baloo 2'; font-size:28px; margin-top:4px;}
  .pad{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-top:36px; max-width:560px; width:100%;}
  .pad-btn{
    aspect-ratio:1; border-radius:20px; background:var(--card); border:1px solid var(--card-border);
    font-family:'Space Grotesk'; font-size:38px; font-weight:700; color:var(--ink);
    transition:all .12s ease;
  }
  .pad-btn:active{transform:scale(.94);}
  .pad-btn.selected{
    background:linear-gradient(140deg, var(--gold), var(--gold-deep)); color:#241238; border-color:transparent;
    box-shadow:0 0 30px rgba(255,215,106,0.55);
  }
  .save-note{margin-top:26px; font-size:16px; color:#7ee787; font-weight:700; min-height:22px;}
  .waiting-box{margin-top:40px; padding:30px; border-radius:18px; background:var(--card); border:1px dashed var(--card-border); max-width:360px; color:var(--lavender);}
  .swap-link{margin-top:30px; font-size:13px; color:var(--lavender-dim); text-decoration:underline;}

  @media (max-width:520px){
    .page{padding-top:70px;}
    .pad{grid-template-columns:repeat(5,1fr); gap:10px;}
    .pad-btn{font-size:26px; border-radius:16px;}
  }
</style>
</head>
<body>
<div class="noise"></div>
<div id="app"></div>

<script>
/* ============== DATA ============== */
const TEAMS = [
  "Șoimii Turnului","Ochii Sibiului","Gardienii Podului","Cavalerii Cetății",
  "Vânătorii de Comori","Exploratorii Transilvaniei","Navigatorii Orașului",
  "Lupii Cibinului","Legendele Brukenthal"
];
const TEAM_ICONS = ["🦅","👁️","🌉","🏰","🗝️","⭐","🧭","🐺","👑"];
const DEFAULT_ORDER = TEAMS.map((_,i)=>i);

const JURY = [
  {id:1, name:"Cristina Boeriu",     r1:"Sincronizare cu originalul", r2:"Notă generală"},
  {id:2, name:"Gorazd Pucelj",       r1:"Coregrafie",                 r2:"Notă generală"},
  {id:3, name:"Andrei Corvin",       r1:"Costume",                    r2:"Notă generală"},
  {id:4, name:"Alina Iosif",         r1:"Creativitate",               r2:"Notă generală"},
  {id:5, name:"Ciprian Draghiceanu", r1:"Interpretare artistică",     r2:"Notă generală"},
  {id:6, name:"Sorin Dicu",          r1:"Umor",                       r2:"Notă generală"},
];
const ROUNDS = {
  1:{title:"Proba 1", subtitle:"Te cunosc de undeva", icon:"🎬"},
  2:{title:"Proba 2", subtitle:"Karaoke", icon:"🎤"},
};

/* EDIT ME: lista de piese pentru extragerea de la Karaoke.
   Încarcă pozele în folderul /songs din repo (același nume ca "image"). */
const SONGS = [
  {id:1,  title:"Piesa Karaoke #1",  artist:"— completează —", image:"songs/song1.jpg"},
  {id:2,  title:"Piesa Karaoke #2",  artist:"— completează —", image:"songs/song2.jpg"},
  {id:3,  title:"Piesa Karaoke #3",  artist:"— completează —", image:"songs/song3.jpg"},
  {id:4,  title:"Piesa Karaoke #4",  artist:"— completează —", image:"songs/song4.jpg"},
  {id:5,  title:"Piesa Karaoke #5",  artist:"— completează —", image:"songs/song5.jpg"},
  {id:6,  title:"Piesa Karaoke #6",  artist:"— completează —", image:"songs/song6.jpg"},
  {id:7,  title:"Piesa Karaoke #7",  artist:"— completează —", image:"songs/song7.jpg"},
  {id:8,  title:"Piesa Karaoke #8",  artist:"— completează —", image:"songs/song8.jpg"},
  {id:9,  title:"Piesa Karaoke #9",  artist:"— completează —", image:"songs/song9.jpg"},
  {id:10, title:"Piesa Karaoke #10", artist:"— completează —", image:"songs/song10.jpg"},
  {id:11, title:"Piesa Karaoke #11", artist:"— completează —", image:"songs/song11.jpg"},
  {id:12, title:"Piesa Karaoke #12", artist:"— completează —", image:"songs/song12.jpg"},
];

function criterionLabel(j, round){ return round===1 ? j.r1 : j.r2; }
function maxForRound(round){ return JURY.length * 10; }
function currentTeamIndex(state){
  const order = (state.order && state.order.length) ? state.order : DEFAULT_ORDER;
  const pos = Math.min(Math.max(state.position||0,0), order.length-1);
  return order[pos];
}
function computeTotals(scores){
  return TEAMS.map((name, ti)=>{
    let t=0;
    JURY.forEach(j=>{
      const v1 = scores[`1-${ti}-${j.id}`]; if(v1!==undefined) t+=v1;
      const v2 = scores[`2-${ti}-${j.id}`]; if(v2!==undefined) t+=v2;
    });
    return {name, ti, icon:TEAM_ICONS[ti], total:t};
  }).sort((a,b)=> b.total - a.total);
}
function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============== STORAGE HELPERS ============== */
async function getState(){
  try{
    const {data, error} = await sb.from('superstars_control')
      .select('team_order, position, round, stage, video_url').eq('id','singleton').maybeSingle();
    if(error || !data) return {order:DEFAULT_ORDER, position:0, round:1, stage:'name', video_url:null};
    return {
      order: (data.team_order && data.team_order.length) ? data.team_order : DEFAULT_ORDER,
      position: data.position || 0,
      round: data.round || 1,
      stage: data.stage || 'name',
      video_url: data.video_url || null,
    };
  }catch(e){ return {order:DEFAULT_ORDER, position:0, round:1, stage:'name', video_url:null}; }
}
async function patchState(patch){
  const cur = await getState();
  const next = {...cur, ...patch};
  try{
    await sb.from('superstars_control').update({
      team_order: next.order, position: next.position, round: next.round,
      stage: next.stage, video_url: next.video_url, updated_at: new Date().toISOString()
    }).eq('id','singleton');
  }catch(e){}
  return next;
}
async function getScores(){
  try{
    const {data, error} = await sb.from('superstars_scores').select('round, team_index, jury_id, score');
    if(error || !data) return {};
    const map = {};
    data.forEach(r => { map[`${r.round}-${r.team_index}-${r.jury_id}`] = r.score; });
    return map;
  }catch(e){ return {}; }
}

/* ============== SVG STAR RING ============== */
function ringSVG(n, filledArr, size){
  size = size || 260;
  const R = size*0.36, cx = size/2, cy = size/2;
  let lines='', dots='';
  for(let i=0;i<n;i++){
    const angle = (-90 + i*(360/Math.max(n,1))) * Math.PI/180;
    const x = cx + R*Math.cos(angle), y = cy + R*Math.sin(angle);
    const f = filledArr[i];
    lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="ring-line${f?' filled':''}"/>`;
    dots  += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" class="ring-dot${f?' filled':''}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" class="ring-svg">${lines}<circle cx="${cx}" cy="${cy}" r="${(R*0.5).toFixed(1)}" class="ring-core"/>${dots}</svg>`;
}
function spawnSparkles(){
  const icons = ['✨','⭐','🌟'];
  for(let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    s.textContent = icons[Math.floor(Math.random()*icons.length)];
    s.style.left = (40 + Math.random()*20) + 'vw';
    s.style.top = (40 + Math.random()*20) + 'vh';
    s.style.animationDelay = (Math.random()*0.5)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 2200);
  }
}

function setupDragReorder(order){
  const container = document.getElementById('orderList');
  if(!container) return;
  const rowEls = Array.from(container.querySelectorAll('.order-row'));

  rowEls.forEach((rowEl)=>{
    const handle = rowEl.querySelector('.drag-handle');
    if(!handle) return;

    handle.onpointerdown = (e)=>{
      e.preventDefault();
      const startIdx = parseInt(rowEl.dataset.idx,10);
      const rowHeight = rowEl.getBoundingClientRect().height;
      const startClientY = e.clientY;
      let targetIdx = startIdx;

      rowEl.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      const onMove = (ev)=>{
        const dy = ev.clientY - startClientY;
        rowEl.style.transform = `translateY(${dy}px)`;
        let t = startIdx + Math.round(dy / rowHeight);
        t = Math.max(0, Math.min(rowEls.length - 1, t));
        rowEls.forEach(r => r.classList.remove('drop-target'));
        if(t !== startIdx && rowEls[t]) rowEls[t].classList.add('drop-target');
        targetIdx = t;
      };

      const onUp = async (ev)=>{
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        rowEl.classList.remove('dragging');
        rowEl.style.transform = '';
        rowEls.forEach(r => r.classList.remove('drop-target'));
        if(targetIdx !== startIdx){
          const newOrder = [...order];
          const [moved] = newOrder.splice(startIdx, 1);
          newOrder.splice(targetIdx, 0, moved);
          await patchState({order:newOrder});
        }
        renderControl();
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    };
  });
}

      <div class="jcrit">${criterion}</div>
      <div class="jteam-tag">
        <div class="lbl">${ROUNDS[round].icon} ${ROUNDS[round].title} — ${ROUNDS[round].subtitle}</div>
        <div class="val">${TEAM_ICONS[teamIndex]} ${TEAMS[teamIndex]}</div>
      </div>
      <div class="pad">
        ${Array.from({length:10}, (_,i)=>i+1).map(n=>`
          <button class="pad-btn${jurySelectedScore===n?' selected':''}" data-n="${n}">${n}</button>
        `).join('')}
      </div>
      <div class="save-note" id="saveNote">${jurySelectedScore!==null ? 'Salvat ✓' : ''}</div>
    </div>`;

  app.querySelectorAll('.pad-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const n = parseInt(btn.dataset.n,10);
      jurySelectedScore = n;
      app.querySelectorAll('.pad-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const note = document.getElementById('saveNote');
      note.textContent = 'Se salvează...';
      await setScoreValue(round, teamIndex, j.id, n);
      note.textContent = 'Salvat ✓';
    };
  });
}
</script>
</body>
</html>
